<html>
<body>  
    
<h2>factorial Number</h2>

<input type="number" id="num">
<button onclick="calculate()">calculate</button>

<p id="result"></p>

<script>
function calculate() {
    let n =Number(document.getElementById("num").value);
    let fact=1;
    for(let i=1;i<=n;i++){
        fact=fact*i
    }

    document.getElementById("result").innerHTML= "Factorial = " + fact;
}
</script>

</body>
</html>
